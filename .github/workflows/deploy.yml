name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 11:17 Asia/Singapore. Scheduled runs verify the build but do not publish.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.13.0
  PNPM_VERSION: 11.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the site
        run: pnpm check

  build-pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_TARGET: pages
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages site
        run: pnpm build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy-pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  build-router:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_TARGET: router
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build root-path router site
        run: pnpm build

      - name: Smoke-test router output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          if grep -R --include='*.html' -F '="/me/' dist; then
            echo 'Router output unexpectedly contains the GitHub Pages base path.' >&2
            exit 1
          fi

      - name: Create reproducible router bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir router-release
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=ustar \
            -C dist \
            -czf router-release/site.tar.gz \
            .
          archive_sha256="$(sha256sum router-release/site.tar.gz | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$archive_sha256" 'site.tar.gz' > router-release/SHA256SUMS
          {
            printf 'schema=1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'archive=site.tar.gz\n'
            printf 'sha256=%s\n' "$archive_sha256"
          } > router-release/deploy-manifest.txt

      - name: Upload router release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-release-${{ github.sha }}
          path: router-release
          if-no-files-found: error
          retention-days: 7

  publish-router:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-router
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: router-release
      cancel-in-progress: false
    steps:
      - name: Download router release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: router-release-${{ github.sha }}
          path: router-release

      - name: Attest router bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: router-release/site.tar.gz

      - name: Publish immutable deployment release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="deploy-${GITHUB_SHA}"
          title="Router deployment ${GITHUB_SHA:0:12}"
          notes="Automated static-site bundle for commit ${GITHUB_SHA}. The archive checksum is in SHA256SUMS and its build provenance is attached to this repository."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" router-release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          else
            gh release create "$tag" router-release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
